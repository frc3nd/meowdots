# # hyprlock configuration

$main_monitor = HDMI-A-1

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor = $main_monitor
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(255, 255, 255, 0.95)
    font_size = 68
    font_family = Comfortaa
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor = $main_monitor
    text = cmd[update:18000000] date +"%A, %d %B %Y"
    color = rgba(220, 220, 220, 0.85)
    font_size = 18
    font_family = Comfortaa
    position = 0, 15
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

input-field {
    monitor = $main_monitor
    size = 280, 52
    outline_thickness = 2
    rounding = -1
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(255, 255, 255)
    font_family = Comfortaa
    fade_on_empty = false
    placeholder_text = <span foreground="##e0e0e0"><i>Пароль...</i></span>
    hide_input = false
    
    position = 0, -65
    halign = center
    valign = center
}

