# # driftwm configuration

mod_key = "super"
focus_follows_mouse = true
window_placement = "auto"
focus_placement = "center"

autostart = [
	'hyprlock'
]

[session]
suspend_on_close = false
restore_windows = true
restore_camera = true
restore_bookmarks = true

[env]
# # Environment variables set before any clients launch.
# # Child processes (autostart, exec bindings) inherit these.
# # These override the compositor's built-in toolkit defaults
# # (MOZ_ENABLE_WAYLAND, QT_QPA_PLATFORM, SDL_VIDEODRIVER, GDK_BACKEND, ELECTRON_OZONE_PLATFORM_HINT).
# # Example:
# # QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
# # MOZ_ENABLE_WAYLAND = "1"

TERMINAL = "kitty"

http_proxy = "http://127.0.0.1:2080"
https_proxy = "http://127.0.0.1:2080"
HTTP_PROXY = "http://127.0.0.1:2080"
HTTPS_PROXY = "http://127.0.0.1:2080"
all_proxy = "socks5://127.0.0.1:2080"
ALL_PROXY = "socks5://127.0.0.1:2080"
no_proxy = "localhost,127.0.0.1,localaddress,.localdomain.com"
NO_PROXY = "localhost,127.0.0.1,localaddress,.localdomain.com"

[input.keyboard]
layout = "us,ru"
remember_layout_per_window = true
variant = ""
options = "grp:win_space_toggle"
model = ""
repeat_rate = 25
repeat_delay = 200
layout_independent = true
num_lock = true
caps_lock = false

[input.trackpad]
# tap_to_click = true         # enable tap-to-click
# natural_scroll = true       # content follows the fingers
# tap_and_drag = true         # double-tap-hold to drag
# accel_speed = 0.0           # pointer acceleration (-1.0 to 1.0)
# accel_profile = "adaptive"  # "flat" or "adaptive"
# click_method = "none"       # "none" (device default), "clickfinger" (finger
                              # count picks the button) or "button_areas"
                              # (where you press picks the button)
# disable_while_typing = true  # palm rejection
# enable = true               # false turns the trackpad off; set-trackpad
                              # overrides it until a restart or a config edit
                              # that changes it
# disable_on_external_mouse = false  # off while an external mouse is connected

[input.mouse]
accel_speed = 0.1
accel_profile = "flat"
natural_scroll = false
left_handed = false

[input.touch]
# # Touchscreen hardware. Gesture thresholds and bindings live in [touch].
# enable = true               # enable touchscreen support
# map_to_output = "none"      # connector name; "none" auto-detects. Set it only
                              # to tell two same-size touchscreens apart.
# # Example:
# # map_to_output = "DP-2"

[input.tablet]
# # Output this tablet maps to; "none" auto-detects (libinput tags, physical
# # size, else the internal panel).
# map_to_output = "none"

[cursor]
theme = "Bibata-Modern-Classic" # "Bibata-Modern-Ice"
size = 12
inactive_opacity = 0.1

[navigation]
trackpad_speed = 1.5
mouse_speed = 1.2
# touch_speed = 1.0           # touchscreen gesture pan multiplier (1.0 = direct, 0 = off)
drift = 0.6
camera_speed = 0.2
auto_navigate_on_close = false
auto_navigate_on_click = false
nudge_step = 20
resize_step = 20
pan_step = 100.0
anchors = []

[navigation.bookmarks]

[navigation.edge_pan]
zone = 0.0
# speed_min = 4.0
# speed_max = 10.0
# cursor_pan = false
cursor_zone = 0.0
# latency_ms = 120

[zoom]
step = 1.26
# trackpad_speed = 1.0        # trackpad pinch-zoom multiplier (1.0 = direct, 0 = off)
mouse_speed = 1.0
# touch_speed = 1.0           # touchscreen gesture zoom multiplier (1.0 = direct, 0 = off)
fit_padding = 80.0
reset_on_new_window = false
reset_on_activation = false
interact_min = 0.0

[snap]
enabled = true
gap = 12.0
outer_gap = 12.0
distance = 24.0
break_force = 32.0
corners = true
centers = false

[decorations]
bg_color = "#303030"
fg_color = "#FFFFFF"
corner_radius = 12
shadow = true

# # driftwm's own title bars (server decorations). The font comes from
# # fontconfig; install `adwaita-fonts` for the default look.
# title_bar_height = 25          # title bar height in px
# font = "Adwaita Sans"          # title text font family
# font_size = 11                 # title text size in points
# font_weight = "medium"         # thin/extralight/light/regular/medium/
                                 # semibold/bold/extrabold/black
# title_align = "center"         # "left" or "center" (long titles left-align)

default_mode = "minimal"

border_width = 0
border_color = "#333333"
border_color_focused = "#333333"

opacity = 1.0
opacity_focused = 1.0

blur = false

[effects]
# blur_radius = 5                # number of Kawase down+up passes
# blur_strength = 1.5            # per-pass texel spread
# animate_blur_fps = 20          # cap (0-144) on re-sampling a background that
                                 # moves on its own (u_time shaders, wallpaper
                                 # daemons); 0 freezes it. Pans and zooms
                                 # always refresh.
# animation_speed = 0.5          # window animation lerp factor (1 = instant)
# animation_scale = 0.95         # open/close grow/shrink amplitude (1 = fade only)

[background]

# type = "none"

type = "shader"
path = "~/work/meowdots/.tmp/border.glsl"

mirror_tile = false
cache_shader = false
cache_budget_mb = 128
animate_fps = 0

[bindings]
