[mouse]
# # When true (default), dragging a window's edge or corner resizes it via the
# # invisible resize border (SSD frame or CSD margin). Set false to make that
# # border inert — resize only through explicit bindings (e.g. alt+right) or
# # gestures. The band stays part of the window either way: pointer focus and
# # on-window bindings still apply over it, so it never reads as empty canvas.
# resize_on_border = true

# # When true, resizing a window by dragging its edge (SSD or CSD border)
# # propagates to every window connected to it via snap adjacency.
# # Only that drag: the grow-window/shrink-window keybindings and the resize
# # gesture always size the one window. Bind `resize-window-snapped` to a mouse
# # button, gesture, or touch trigger for a cluster-aware drag of your own.
# decoration_resize_snapped = false

# # When true, maximize/unmaximize initiated via window decoration (CSD maximize
# # button, SSD title-bar double-click, or xdg/foreign-toplevel set_maximized)
# # propagates to every window connected via snap adjacency.
# # Keybinding/gesture fit is unaffected — bind `fit-window-snapped` explicitly
# # if you want cluster-aware fit there too.
# decoration_fit_snapped = false

# # Mouse bindings: "Modifier+...+Trigger" = "action"
# # Context-aware: on-window, on-canvas, anywhere.
# # Specific context checked first, then "anywhere" as fallback.
# # Click-to-focus and SSD decoration clicks are always hardcoded.
# # Triggers: left, right, middle (buttons), trackpad-scroll, wheel-scroll,
# # wheel-up, wheel-down. The wheel-up/wheel-down triggers fire once per
# # discrete wheel notch and can run any action, e.g. volume on mod+shift+scroll.
# # Merges with defaults. Use "none" to unbind.
# #
# # Mouse actions:
# #   move-window             — drag the focused window
# #   move-snapped-windows    — drag the window plus every window connected via snap adjacency
# #   resize-window           — drag-resize the focused window
# #   resize-window-snapped   — drag-resize, propagating to the snap cluster
# #   pan-viewport            — drag or scroll to pan the camera
# #   zoom                    — drag or scroll to zoom
# #   center-nearest          — navigate toward the drag direction
# #
# # Any action from the [keybindings] Actions list also works on button and
# # wheel-up/wheel-down triggers: `exec <cmd>`, close-window, toggle-fullscreen, etc.

[mouse.on-window]
# "alt+left" = "move-window"
# "alt+shift+left" = "move-snapped-windows"
# "alt+right" = "resize-window"
# "alt+shift+right" = "resize-window-snapped"
# "alt+middle" = "fit-window"
# "alt+shift+middle" = "fit-window-snapped"
# "mod+middle" = "toggle-fullscreen"

[mouse.on-canvas]
# "left" = "pan-viewport"            # unmodified left-click on empty canvas → pan
# "trackpad-scroll" = "pan-viewport" # trackpad scroll on empty canvas → pan
# "wheel-scroll" = "zoom"            # mouse wheel on empty canvas → zoom

[mouse.anywhere]
# "mod+left" = "pan-viewport"
# "mod+ctrl+left" = "center-nearest" # direction from drag delta
# "mod+trackpad-scroll" = "pan-viewport"
# "mod+wheel-scroll" = "zoom"

[gestures]
# # Trackpad gesture thresholds — tune for your touchpad size.
# # These three keys also exist under [touch] for the touchscreen, where
# # swipe_threshold is measured in millimetres — the values are not
# # interchangeable between the two sections.
# swipe_threshold = 12.0        # px cumulative distance before directional swipe fires
# pinch_in_threshold = 0.85     # scale below which pinch-in fires (1.0 = no pinch)
# pinch_out_threshold = 1.15    # scale above which pinch-out fires (1.0 = no pinch)

# # Gesture bindings: `"Modifier+N-finger-<type>" = "action"`
# # Context-aware: on-window, on-canvas, anywhere.
# # Unbound gestures are forwarded to the focused app.
# # "none" unbinds.
# #
# # Gesture types (2–5 fingers):
# #   N-finger-swipe            — continuous OR threshold (action determines behavior)
# #   N-finger-swipe-up/down/left/right — threshold only, physical finger direction
# #   3-finger-doubletap-swipe  — continuous only (window grabs; 3-finger tap then swipe)
# #   N-finger-pinch            — continuous only (use pinch-in/out for discrete)
# #   N-finger-pinch-in/out     — threshold only
# #   N-finger-hold             — threshold only (fires on release)
# #
# # Continuous actions, locked to their triggers:
# #   pan-viewport            — swipe
# #   zoom                    — pinch
# #   move-window             — swipe or doubletap-swipe
# #   move-snapped-windows    — swipe or doubletap-swipe
# #   resize-window           — swipe or doubletap-swipe
# #   resize-window-snapped   — swipe or doubletap-swipe
# #
# # Threshold actions: any action from the [keybindings] Actions list.
# # center-nearest may also be bound bare — its direction is the pan direction of
# # the swipe (fingers left looks right), unlike the named per-direction triggers
# # above which are physical (swipe triggers only).

[gestures.on-window]
# "alt+3-finger-swipe" = "resize-window"
# "alt+shift+3-finger-swipe" = "resize-window-snapped"
# "3-finger-doubletap-swipe" = "move-window"
# "alt+2-finger-pinch-in" = "fit-window"
# "alt+2-finger-pinch-out" = "fit-window"
# "alt+shift+2-finger-pinch-in" = "fit-window-snapped"
# "alt+shift+2-finger-pinch-out" = "fit-window-snapped"
# "alt+3-finger-pinch-in" = "toggle-fullscreen"
# "alt+3-finger-pinch-out" = "toggle-fullscreen"

[gestures.on-canvas]
# "2-finger-pinch" = "zoom"

[gestures.anywhere]
# "3-finger-swipe" = "pan-viewport"         # continuous (per-frame dx/dy)
# "4-finger-swipe" = "center-nearest"       # threshold (accumulate, detect direction, fire once)
# "mod+3-finger-swipe" = "center-nearest"   # mod makes 3-finger swipe navigate too
# # Example: per-direction overrides (threshold only)
# # "4-finger-swipe-up" = "exec brightnessctl set +5%"
# # "4-finger-swipe-down" = "exec brightnessctl set 5%-"
# # "4-finger-swipe-right" = "cycle-windows forward"
# # "4-finger-swipe-left" = "cycle-windows backward"
# "mod+2-finger-pinch" = "zoom"             # mod overrides app forwarding
# "3-finger-pinch" = "zoom"                 # continuous
# "4-finger-pinch-in" = "zoom-to-fit"       # threshold
# "mod+4-finger-pinch-in" = "zoom-to-fit-snapped"
# "4-finger-pinch-out" = "home-toggle"      # threshold
# "mod+3-finger-pinch-in" = "zoom-to-fit"
# "mod+3-finger-pinch-out" = "home-toggle"
# "4-finger-hold" = "center-window"         # fires on release
# "mod+3-finger-hold" = "center-window"

[touch]
# # Touchscreen gesture thresholds. Touchscreen hardware (enable, output
# # mapping) is configured under [input.touch] instead.
# #
# # These three keys share their names with [gestures], but the values are not
# # interchangeable: swipe_threshold is in millimetres here and in px there. A
# # touchscreen is a display, so swipe travel is physical — the millimetre value
# # is converted to px through the panel's pixel density.
# #
# # swipe_threshold must be positive; 0 or less falls back to the default with a
# # warning.
# swipe_threshold = 15.0        # mm cumulative distance before directional swipe fires
# pinch_in_threshold = 0.85     # scale below which pinch-in fires (1.0 = no pinch)
# pinch_out_threshold = 1.15    # scale above which pinch-out fires (1.0 = no pinch)

# # Tap and hold timings. Raise them if gestures need a deliberate, unhurried
# # touch; lower them if the panel feels sluggish to respond. Every single tap
# # waits out double_tap_time before firing — lower it for snappier taps, at the
# # cost of needing faster double-taps.
# tap_time = 250                # ms a tap may last; lift later and no tap fires
# double_tap_time = 300         # ms window for a second tap to pair into a
                                # double-tap — and the delay a single tap's
                                # action waits out before it fires
# hold_time = 350               # ms of dwell before a drag commits as a hold
                                # gesture (hold-swipe, doubletap-hold-swipe)
                                # instead of a plain swipe
# tap_travel = 2.0              # mm a contact may drift and still count as a
                                # tap; past this it becomes a pan or drag

# # Bindings: `"N-finger-<type>" = "action"`  (touch has no keyboard modifiers)
# # Context-aware: on-window, on-canvas, anywhere.
# # Unbound gestures are forwarded to the focused app.
# # "none" removes a binding in its context. A fully unbound gesture forwards to the app.
# #
# # Touch gesture types (1–5 fingers):
# #   N-finger-swipe            — continuous OR threshold (action determines behavior)
# #   N-finger-swipe-up/down/left/right — threshold only, physical finger direction
# #   N-finger-pinch            — continuous only (use pinch-in/out for discrete)
# #   N-finger-pinch-in/out     — threshold only
# #   N-finger-tap              — threshold only (quick touch, no movement)
# #   N-finger-doubletap        — threshold only (two quick taps)
# #   N-finger-doubletap-swipe  — continuous only (tap then drag)
# #   N-finger-doubletap-hold-swipe  — continuous only (tap, hold, then drag)
# #   N-finger-hold-swipe       — continuous only (dwell then drag)
# #
# # Continuous and threshold actions: the same sets and rules as under [gestures].

[touch.on-window]
# # 1–2 fingers starting on a window forward to the app, and the 3+ finger
# # pan/zoom/navigate gestures are bound "anywhere" so they apply over windows
# # too. The window-targeted gestures live here: they act on the window the
# # fingers land on (a gesture starting on empty canvas just pans).
# "3-finger-doubletap" = "fit-window"
# "3-finger-doubletap-swipe" = "move-window"  # continuous
# "3-finger-hold-swipe" = "resize-window"     # continuous (dwell then drag)
# "3-finger-doubletap-hold-swipe" = "move-snapped-windows"  # continuous (tap, hold, then drag — moves the whole snap cluster)

[touch.on-canvas]
# "1-finger-swipe" = "pan-viewport"
# "2-finger-swipe" = "pan-viewport"
# "2-finger-pinch" = "zoom"

[touch.anywhere]
# "3-finger-swipe" = "pan-viewport"           # continuous
# "3-finger-pinch" = "zoom"                    # continuous
# "4-finger-swipe" = "center-nearest"         # threshold (direction from drag)
# "4-finger-pinch-in" = "zoom-to-fit"         # threshold
# "4-finger-pinch-out" = "home-toggle"        # threshold
# "5-finger-swipe" = "center-nearest"         # threshold (direction from drag)
# "5-finger-pinch-in" = "zoom-to-fit"         # threshold
# "5-finger-pinch-out" = "home-toggle"        # threshold
# "3-finger-tap" = "center-window"

[xwayland]
# # X11 support via xwayland-satellite. driftwm spawns satellite eagerly at
# # startup, exports DISPLAY=:N, and X11 apps connect transparently. If the
# # binary isn't found, X11 support is disabled with a warning; everything
# # else still runs.
enabled = true                  # spawn xwayland-satellite at startup
path    = "xwayland-satellite"  # path to xwayland-satellite binary ($PATH lookup works)

[backend]
# # Hardware stability quirks. All default to false (opt-in).
# # Enable these if you experience flickering, crashes, or rendering issues.
# # Particularly useful on NVIDIA GPUs with proprietary drivers.
# # Note: These flags must be set before launching driftwm. Changing them requires a restart.
# # For additional NVIDIA-specific settings, set these environment variables in your
# # session wrapper script or shell profile before starting driftwm:
# #   export SMITHAY_USE_LEGACY=1          # Use legacy DRM API instead of atomic modesetting
# #   export __GL_GSYNC_ALLOWED=0
# #   export __GL_VRR_ALLOWED=0
# #   export __GL_MaxFramesAllowed=1
# #   export NVD_BACKEND=direct
# wait_for_frame_completion = false  # Force GPU-fence wait before every page flip
                                     # (already done automatically when smithay reports
                                     # needs_sync — typical case on NVIDIA. Set true
                                     # only if you still see flicker after defaults.)
# disable_direct_scanout = false     # Force EGL composition (disable direct scanout)
# disable_hardware_cursor = false    # Composite the cursor into the frame instead of
                                     # using the KMS cursor plane, while keeping direct
                                     # scanout for fullscreen apps. Fixes a stuttering /
                                     # tearing hardware cursor on discrete NVIDIA GPUs.
# max_capture_fps = 0                # Cap FPS delivered to continuous screen-capture
                                     # clients (recorders / casts). 0 = unlimited. Each
                                     # captured frame forces a full-scene re-composite
                                     # that competes with a fullscreen app behind it; a
                                     # cap (e.g. 30 or 60) trims that overhead while
                                     # gaming + streaming. One-shot screenshots (grim)
                                     # are never throttled.

[output.outline]
# color = "#ffffff"           # outline color for other monitors' viewports
# thickness = 1               # pixels (0 to disable)
# opacity = 0.5               # 0.0–1.0

# ## Outputs
# # Per-output configuration — the monitor's hardware setup, plus the handful of
# # behaviors that are worth varying between a widescreen and a portrait panel.
# # Each [[outputs]] entry matches by connector name. Find connector names with
# # wlr-randr or check driftwm logs at startup. Outputs without a matching entry
# # default to scale 1.0.
# # On the winit backend only `position` and `focus_placement` apply — mode,
# # scale and transform belong to the host window.
# #
# # `name = "*"` is a wildcard entry: it applies to any connected output that
# # has no exact-name entry (exact entries always win). A fixed `position` makes
# # no sense on the wildcard — it's ignored (falls back to "auto").
# #
# # An exact-name entry replaces the wildcard entry wholesale — fields do not
# # merge. So if `name = "*"` sets focus_placement = "right" and an exact
# # `name = "DP-1"` entry sets only `scale`, DP-1 takes neither the wildcard's
# # focus_placement nor its hot corners: every field it doesn't name falls back
# # to the top-level key or the built-in default, never to the wildcard.
# #
# # `mode` accepts "preferred", "max", "WxH", or "WxH@Hz". "preferred" (the
# # default, and the safe choice) uses the monitor's advertised preferred mode.
# # "max" picks the highest resolution, then highest refresh. A bare "WxH" only
# # selects a mode the monitor already advertises — if none matches, it keeps the
# # preferred mode (logged as a warning, not an error). "WxH@Hz" forces that exact
# # mode, synthesizing a CVT modeline when the monitor doesn't advertise it
# # (intended for CRTs or forcing non-standard modes; may be rejected by some panels).
# #
# # Supported fields:
# #   name            — connector name, or "*" for the fallback entry (see
# #                     above); required.
# #   scale           — fractional scale factor (default: 1.0).
# #   transform       — normal, 90, 180, 270, flipped, flipped-90, flipped-180,
# #                     or flipped-270 (default: normal).
# #   position        — "auto" (left-to-right placement) or [x, y] in layout
# #                     coords.
# #   mode            — "preferred", "max", "WxH", or "WxH@Hz" (see above;
# #                     default: preferred).
# #   focus_placement — where a centering navigation parks the focused window
# #                     on THIS monitor; the same nine values as the top-level
# #                     key (see General), which it overrides.
# #   hot_corners     — per-output screen-corner action bindings (see below).
# #
# # Hot-corners bind any keyboard action to a screen corner. The action fires
# # when the cursor enters that corner of THIS output (per-monitor setting),
# # and re-arms when the cursor leaves. The whole `[[outputs]]` block can be
# # omitted if you don't need any hot corners on a particular monitor.
# # A `name = "*"` entry's hot corners apply to any output without an
# # exact-name `[[outputs]]` entry; per the wholesale-replacement rule above, an
# # exact entry with no `hot_corners` table gets none.
# #
# # Corner actions: any action from the [keybindings] Actions list. Pass
# # "none" to leave a corner unbound.
# #
# # Example:

[[outputs]]
name = "DP-2"            # connector name, or "*" for a fallback entry (required)
scale = 1.0              # fractional scale (default: 1.0)
transform = "normal"     # normal, 90, 180, 270, flipped, flipped-90, flipped-180, flipped-270
position = [-1920, 160]  # "auto" (left-to-right) or [x, y] in layout coords
mode = "max"    		 # "preferred", "max", "1920x1080", or "2560x1440@144"

[[outputs]]
name = "HDMI-A-1"
position = "auto"
scale = 1.0
mode = "preferred"

# #
# # [[outputs]]
# # name = "HDMI-A-1"
# # scale = 1.0
# # mode = "1920x1080@60"
# # focus_placement = "right"   # park the active window against this ultrawide's right edge
# #
# # [outputs.hot_corners]
# # threshold = 4         # corner zone size in logical px (default: 4)
# # top_left = "zoom-to-fit"
# # top_right = "none"
# # bottom_left = "spawn grim - | wl-copy"
# # bottom_right = "exec-launcher"
# # disable_when_fullscreen = true   # suppress hot-corners while a fullscreen window is on this output (default: true)
# # disable_while_dragging  = true   # suppress hot-corners while any mouse button is held, or a pointer grab (move/resize/pan) is active (default: true)

# ## Window rules
# # Window rules: match windows and apply per-window overrides.
# # ALL matching rules are merged in config order (later rules override earlier
# # ones for scalar fields; boolean flags are sticky-on). This lets you compose
# # rules — e.g. one rule sets blur=true, a later one adds opacity=0.85.
# #
# # This section is the field reference. The full recipe collection, along with
# # matching/merge semantics and pattern-syntax details, lives in
# # docs/window-rules.md.
# #
# # Supported fields:
# #   app_id     — match: Wayland app_id. X11 apps proxied via xwayland-satellite
# #                arrive with app_id set from WM_CLASS instance (typically
# #                lowercase). At least one of app_id/title is required; all
# #                specified criteria must match.
# #   title      — match: window title.
# #   position   — [x, y] coordinates (visual-frame center, Y-up). Canvas coords,
# #                or output-relative (origin = output center) when
# #                pinned_to_screen.
# #   size       — [width, height] initial dimensions of the visual frame — the
# #                app's content plus any title bar and border driftwm draws, so
# #                the same numbers give the same on-screen rectangle whatever
# #                the decoration mode (one-shot; user/app can resize afterwards,
# #                so pair with widget = true to lock it)
# #   fullscreen — true: force this window to open in fullscreen mode
# #   focus_on_open — false: map the window without focusing it or moving the
# #                camera to it. Omit to keep the default focus-on-map behavior.
# #                Pairs well with pinned_to_screen for unobtrusive overlays; the
# #                window still takes focus later through normal interaction
# #                (hover or click). (default: true)
# #   widget     — true: pinned (immovable), below normal windows, excluded from
# #                navigation and alt-tab (default: false)
# #   pinned_to_screen — true: lock the window to the output's screen space —
# #                ignores pan/zoom, floats above normal windows (PiP, toolbars).
# #                `position` becomes output-relative; movable unless widget = true.
# #                Toggle live with `toggle-pin-to-screen` (Mod+T). (default: false)
# #   suspend_on_close — override [session].suspend_on_close for matched windows
# #                (true / false). Escape hatch for terminals and scratchpads that
# #                should always really close (or always suspend). (default: inherit)
# #   restore_windows — override [session].restore_windows for matched windows
# #                (true / false). false keeps an app out of the session save, so
# #                it doesn't come back as a suspended window on the next launch;
# #                true restores one app while the section key stays off. Key the
# #                rule on app_id, since a rule matching on title alone governs
# #                saving only. Independent of suspend_on_close, which governs
# #                closes: set both false for an app that should never leave a
# #                stand-in behind. A window you suspended explicitly still comes
# #                back. (default: inherit)
# #   preserve_aspect_ratio — true: keep the window's aspect ratio during
# #                interactive resizes; the ratio is taken at the start of each
# #                resize. (default: false)
# #   decoration — overrides [decorations] default_mode for matched windows.
# #                Omit to inherit default_mode. Values:
# #                "client":  CSD — client's own titlebar
# #                "server":  SSD — driftwm's titlebar
# #                "minimal": SSD — no titlebar, just shadow + corners + border
# #                            (this is the mode for chrome-on-borderless widgets;
# #                            border_width / corner_radius / shadow rules apply)
# #                "none":    bare client surface — compositor adds zero chrome,
# #                            and per-window border_width / corner_radius /
# #                            shadow rules are ignored. Use "minimal" if you
# #                            want chrome without a titlebar.
# #   blur       — true: blur background behind this window (default: false). Real
# #                GPU/VRAM cost, but it tracks the window's size on screen, so
# #                zooming out makes a blurred window cheaper, not dearer. Once
# #                several blurred windows cover most of the viewport between
# #                them the compositor switches to one shared full-screen blur
# #                they all sample, so a screenful of frost doesn't multiply the
# #                work. Results are cached, and recomputed when the view moves
# #                or the content behind the window changes.
# #   opacity    — 0.0–1.0: window transparency (default: 1.0, fully opaque).
# #                Below 1.0 a fullscreen window shows the canvas behind it
# #                instead of black: this [background] (dot grid, shader or
# #                image) and any canvas layers keep drawing under it, while
# #                every layer surface stays hidden along with the other
# #                windows. A wlr-layer wallpaper daemon (swaybg, swww) is a
# #                layer surface, so it does not show through; set the
# #                wallpaper in [background] if you want it visible. Costs
# #                that output its direct scan-out for as long as the window
# #                is fullscreen, so leave games opaque.
# #   border_width         — per-window border width override (px). Set to 0 to
# #                          disable border on a window even when [decorations]
# #                          border_width > 0. Ignored for decoration = "none".
# #   border_color         — per-window unfocused border color, "#rrggbb" or
# #                          "#rrggbbaa" (optional alpha byte), e.g. "#5c5c5c".
# #   border_color_focused — per-window focused border color; same "#rrggbb[aa]"
# #                          form, with an optional alpha byte.
# #   corner_radius        — per-window corner radius override (px). Affects
# #                          content clip, border shape, and shadow. Ignored for
# #                          decoration = "none".
# #   shadow               — per-window shadow toggle. Overrides [decorations]
# #                          shadow. Ignored for decoration = "none".
# #   output     — output name (e.g. "DP-1") for this window's fullscreen and
# #                initial screen-pin placement. Fullscreen: the rule wins;
# #                otherwise the output the client requested; otherwise the
# #                active output. pinned_to_screen: the rule; otherwise the
# #                active output — with `position` resolved against it; dragging
# #                or send-to-output reassigns it afterward. Find names under
# #                `outputs.*` in `driftwm msg state`. (default: unset)
# #   pass_keys  — controls which compositor keybindings are forwarded to the app:
# #                  pass_keys = true — forward ALL keys (game-friendly)
# #                  pass_keys = ["mod+q", "ctrl+q"] — forward ONLY these combos; all other compositor shortcuts stay active
# #                  pass_keys = false / omit — compositor handles everything (default)
# #                  VT switching (Ctrl+Alt+F1–F12) — always stays in the compositor
# #   layer_order — stacking among layer surfaces sharing the same wlr-layer
# #                 (higher = on top; ties stack by map order, newest on top).
# #                 The protocol has no z-index within a layer, so two overlay
# #                 clients (e.g. an on-screen keyboard and a touch visualizer)
# #                 otherwise stack by launch order. Also orders canvas-positioned
# #                 layers among themselves. Ignored for regular windows.
# #
# # Pattern syntax (applies to all match fields):
# #   Plain string `"kitty"`        — exact match
# #   Glob `"steam_app_*"`          — `*` wildcard
# #   Regex `"/^steam_app_\\d+$/"`  — wrap in `/…/`
# #
# # To find a window's identifiers, run while the window is open:
# #   `driftwm msg state`
# #
# # Layer-shell surfaces (panels, notifications, bars like waybar):
# # matched by their namespace against `app_id`. `decoration` is ignored —
# # layers have no decoration mode. Chrome (border_width, corner_radius,
# # shadow) is field-by-field opt-in on the rule and does NOT inherit from
# # [decorations]. Without explicit values on the rule, a layer surface has no
# # border, no shadow, and no corner clip.
# #
# # A few representative rules follow; docs/window-rules.md collects the rest.
# #
# # Example: Picture-in-Picture, pinned to the screen, stays put while you pan/zoom
# # [[window_rules]]
# # title            = "Picture-in-Picture"
# # pinned_to_screen = true
# # position         = [0, -300]   # output-relative: 300px below center; movable, drop to center on the output
# #
# # Example: Game, only let ctrl+q through, keep everything else (mod+q still closes)
# # [[window_rules]]
# # app_id    = "factorio"
# # pass_keys = ["ctrl+q"]
# #
# # Example: Compose rules, blur from first rule, opacity from second (both apply)
# # [[window_rules]]
# # app_id = "Alacritty"
# # blur   = true
# #
# # [[window_rules]]
# # app_id  = "Alacritty"
# # opacity = 0.9
